<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le 15 du Clic — Admin</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<style>
  table { width: 100%; border-collapse: collapse; background: white; font-size: 0.92rem; }
  th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; vertical-align: top; }
  th { background: var(--bleu); color: white; position: sticky; top: 0; }
  tr.statut-nouveau { background: #fdecea; }
  tr.statut-en-cours { background: #fff8e1; }
  tr.statut-resolu { background: #eaf6ea; }
  #filtres { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  #filtres select, #filtres input { padding: 0.4rem; border-radius: 6px; border: 1px solid #ccc; }
  select.statut-select { padding: 0.3rem; }
  #login { max-width: 320px; margin: 3rem auto; text-align: center; }
  #login input {
    width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid #ccc;
    font-size: 1rem; margin-bottom: 0.8rem; box-sizing: border-box;
  }
  #login-erreur { color: var(--danger); min-height: 1.2rem; margin-bottom: 0.5rem; }
  .question-admin-card { display: flex; flex-direction: column; gap: 0.5rem; }
  .question-admin-card textarea.q-reponse-input {
    width: 100%; min-height: 3.5rem; padding: 0.5rem; box-sizing: border-box;
    border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 0.95rem;
  }
  .question-admin-card .btn-repondre { align-self: flex-start; }

  @media (max-width: 700px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    table { border: none; background: none; }
    tr {
      background: white; border: 1px solid #ddd; border-radius: 10px;
      margin-bottom: 0.8rem; padding: 0.3rem 0; overflow: hidden;
    }
    td {
      border: none; border-bottom: 1px solid #eee;
      padding: 0.5rem 0.7rem; padding-left: 42%; position: relative;
      min-height: 1.4rem;
    }
    td:last-child { border-bottom: none; }
    td::before {
      content: attr(data-label);
      position: absolute; left: 0.7rem; top: 0.5rem;
      width: 38%; font-weight: bold; color: var(--bleu);
    }
  }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" width="40" height="40">
  <h1>Le 15 du Clic — Admin</h1>
  <a href="/">← Retour à l'app</a>
</header>
<main style="max-width:1100px;">
  <div id="login">
    <p>Mot de passe partagé pour la consultation des signalements :</p>
    <input type="password" id="login-mdp" placeholder="Mot de passe" autocomplete="current-password">
    <div id="login-erreur"></div>
    <button class="primary" id="btn-login">Se connecter</button>
  </div>
  <div id="admin-content" style="display:none;">
    <div id="filtres">
      <select id="f-salle"><option value="">Toutes les salles</option></select>
      <select id="f-statut">
        <option value="">Tous les statuts</option>
        <option value="nouveau">Nouveau</option>
        <option value="en cours">En cours</option>
        <option value="résolu">Résolu</option>
      </select>
      <button class="secondary" id="btn-refresh">🔄 Actualiser</button>
    </div>
    <div id="table-wrap">Chargement…</div>

    <h2 style="margin-top:2.5rem;">❓ Questions des collègues</h2>
    <div id="questions-wrap">Chargement…</div>
  </div>
</main>
<div id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
